services:
  app:
    build: .
    ports:
      - "7070:7070"
    volumes:
      # Mount the 'projects' folder so users can analyze local files easily.
      # Users must create a folder named 'projects' next to this file!
      - ./projects:/app/projects
      - ./reports:/app/reports
    environment:
      - DATABASE_URL=jdbc:sqlite:db/smojol_db.sqlite
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5.15.0
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    volumes:
      - ./neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
